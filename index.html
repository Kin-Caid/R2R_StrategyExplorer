                    p2: "Build public tools (311 issue tracker, water quality map, investment map).",
                    p3: "Establish multilingual non-digital access pathways.",
                    p4: "Conduct annual tool usage and feedback evaluation."
                }
            },
            {
                id: "2.6",
                title: "Support Community-Designed Green Infrastructure",
                wave: 4,
                timeframe: "2031–2035",
                rationale: "Co-designed neighborhood green infrastructure with documented stewardship.",
                keyOutput: "2-3 Completed GI Projects with Community Stewardship Agreements",
                prereqs: ["2.1", "2.3", "2.5", "1.2", "2.7", "3.3"],
                unlocks: ["Next Decade Plan"],
                phases: {
                    p1: "Conduct co-design process in 2-3 equity priority neighborhoods.",
                    p2: "Assess community stewardship capacity and build support agreements.",
                    p3: "Construct projects with signed stewardship agreements.",
                    p4: "Conduct 1, 3, and 5-year post-completion environmental monitoring."
                }

        ];

        // Ensure cross-references are complete (bidirectional indexing helper)
        const normalizeData = (data) => {
            const mapped = data.map(item => ({ ...item, prereqs: [...item.prereqs], unlocks: [...item.unlocks] }));
            mapped.forEach(item => {
                item.unlocks.forEach(unlockId => {
                    const target = mapped.find(t => t.id === unlockId);
                    if (target && !target.prereqs.includes(item.id)) target.prereqs.push(item.id);
                });
                item.prereqs.forEach(prereqId => {
                    const source = mapped.find(t => t.id === prereqId);
                    if (source && !source.unlocks.includes(item.id)) source.unlocks.push(item.id);
                });
            });
            return mapped;
        };

        const WAVE_COLORS = {
            0: '#64748b', // Slate
            1: '#2563eb', // Blue
            2: '#059669', // Emerald
            3: '#d97706', // Amber
            4: '#7c3aed'  // Purple

        const WAVE_NAMES = [
            "Wave 0: Pre-Reqs",

        // --- COMPONENTS ---

        const NetworkGraph = ({ items, selectedId, onSelect, waveFilter, searchQuery }) => {
            const containerRef = useRef(null);
            const networkRef = useRef(null);

            useEffect(() => {
                const options = {
                    layout: {
                        hierarchical: {
                            direction: 'LR',
                            sortMethod: 'directed',
                            levelSeparation: 250,
                            nodeSpacing: 100,
                            treeSpacing: 100,
                            parentCentralization: true
                        }
                    },
                    physics: false,
                    nodes: {
                        shape: 'box',
                        margin: 12,
                        font: { face: 'Inter, sans-serif', size: 14 }
                    },
                    edges: {
                        arrows: 'to',
                        smooth: { type: 'cubicBezier' },
                        width: 2
                    },
                    interaction: { hover: true }
                };

                networkRef.current = new vis.Network(containerRef.current, { nodes: [], edges: [] }, options);

                networkRef.current.on("click", function (params) {
                    if (params.nodes.length > 0) {
                        onSelect(params.nodes[0]);
                    } else {
                        onSelect(null);
                    }
                });

                return () => networkRef.current.destroy();
            }, []);

            useEffect(() => {
                if (!networkRef.current) return;

                // 1. Build adjacency list for upstream/downstream tracking
                const adj = {}; const revAdj = {};
                items.forEach(i => { adj[i.id] = []; revAdj[i.id] = []; });
                items.forEach(i => {
                    i.unlocks.forEach(u => { if (adj[i.id] && adj[u]) { adj[i.id].push(u); revAdj[u].push(i.id); } });
                });

                // 2. Identify upstream and downstream subsets
                const upstream = new Set();
                const downstream = new Set();
                const directPrereqs = new Set();
                const directUnlocks = new Set();
                if (selectedId) {
                    const dfs = (node, graph, set) => {
                        graph[node]?.forEach(n => {
                            if (!set.has(n)) { set.add(n); dfs(n, graph, set); }
                        });
                    };
                    dfs(selectedId, revAdj, upstream);
                    dfs(selectedId, adj, downstream);
                    revAdj[selectedId]?.forEach(id => directPrereqs.add(id));
                    adj[selectedId]?.forEach(id => directUnlocks.add(id));
                }

                // 3. Prepare Nodes
                const wrapText = (text, max = 25) => {
                    const words = text.split(' ');
                    let lines = [], cur = '';
                    words.forEach(w => {
                        if ((cur + w).length > max) { lines.push(cur); cur = w + ' '; } 
                        else cur += w + ' ';
                    });
                    lines.push(cur);
                    return lines.join('\n').trim();
                };

                const nodes = items.map(item => {
                    const isSelected = item.id === selectedId;
                    const isDirectUp = directPrereqs.has(item.id);
                    const isDirectDown = directUnlocks.has(item.id);
                    const isIndirectUp = !isDirectUp && upstream.has(item.id);
                    const isIndirectDown = !isDirectDown && downstream.has(item.id);
                    
                    let bg = WAVE_COLORS[item.wave];
                    let font = '#ffffff';
                    let opacity = 1;

                    if (selectedId) {
                        if (isSelected) bg = '#4f46e5'; // Indigo-600
                        else if (isDirectUp) bg = '#f97316'; // Orange/Red (Direct Prereq)
                        else if (isDirectDown) bg = '#10b981'; // Emerald-500 (Direct Unlock)
                        else if (isIndirectUp || isIndirectDown) { bg = '#cbd5e1'; font = '#334155'; opacity = 0.9; } // Grey for indirect
                        else { bg = '#f1f5f9'; font = '#94a3b8'; opacity = 0.4; }
                    } else {
                        const waveMatch = waveFilter === 'All' || item.wave.toString() === waveFilter;
                        const searchMatch = !searchQuery || item.id.toLowerCase().includes(searchQuery.toLowerCase()) || item.title.toLowerCase().includes(searchQuery.toLowerCase());
                        if (!waveMatch || !searchMatch) {
                            bg = '#f1f5f9'; font = '#94a3b8'; opacity = 0.4;
                        }
                    }

                    return {
                        id: item.id,
                        level: item.wave, // Lock to swimlanes
                        label: `<b>${item.id}</b>\n${wrapText(item.title)}`,
                        color: {
                            background: bg,
                            border: isSelected ? '#0f172a' : bg,
                            highlight: { background: bg, border: '#0f172a' },
                            hover: { background: bg, border: '#0f172a' }
                        },
                        font: { color: font, multi: 'html', bold: isSelected },
                        borderWidth: isSelected ? 3 : 0,
                        opacity: opacity,
                        shadow: isSelected ? { enabled: true, color: 'rgba(0,0,0,0.2)', size: 10 } : false
                    };
                });

                // 4. Prepare Edges
                const edges = [];
                items.forEach(i => {
                    i.unlocks.forEach(u => {
                        if (!items.find(x => x.id === u)) return;
                        let color = '#cbd5e1'; // default dim
                        let opacity = 0.5;

                        if (selectedId) {
                            if (u === selectedId) {
                                color = '#f97316'; opacity = 1; // Incoming from direct prereq
                            } else if (i.id === selectedId) {
                                color = '#10b981'; opacity = 1; // Outgoing to direct unlock
                            } else {
                                color = '#f1f5f9'; opacity = 0.15; // Unrelated/indirect edges (faded but layout-preserving)
                            }
                        } else if (waveFilter === 'All' && !searchQuery) {
                            color = '#cbd5e1'; opacity = 0.8;
                        }

                        edges.push({
                            from: i.id,
                            to: u,
                            color: { color, opacity, highlight: color, hover: color }
                        });
                    });
                });

                networkRef.current.setData({ nodes, edges });
            }, [items, selectedId, waveFilter, searchQuery]);

            return <div ref={containerRef} className="w-full h-full bg-slate-50 outline-none" />;
        };

                                    {waveItems.map(item => {
                                        const isSelected = item.id === selectedId;

                                        const isDirectDown = directUnlocks.has(item.id);
                                        const isIndirectUp = !isDirectUp && upstream.has(item.id);
                                        const isIndirectDown = !isDirectDown && downstream.has(item.id);
                                        const searchMatch = !searchQuery || item.id.toLowerCase().includes(searchQuery.toLowerCase()) || item.title.toLowerCase().includes(searchQuery.toLowerCase());
                                        
                                        if (!searchMatch && searchQuery) return null;

                                        let style = "bg-white border-slate-200 text-slate-700";
                                        if (selectedId) {

                                            else style = "bg-white border-slate-200 text-slate-400 opacity-50";
                                        }

                                        return (
                                            <div 
                                                key={item.id} 
                                                onClick={() => onSelect(item.id)}
                                                className={`p-4 rounded-lg border shadow-sm cursor-pointer transition-all hover:shadow-md ${style}`}
                                            >
                                                <div className="flex items-center gap-2 mb-2">
                                                    <span className="text-xs font-bold px-2 py-1 rounded text-white" style={{backgroundColor: WAVE_COLORS[w]}}>
                                                        {item.id}

                                    <Icons.Download />
                                </button>
                                <button onClick={handleReset} title="Reset to Defaults" className="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors border border-slate-200">
                                    <Icons.RefreshCw />
                                </button>
                            </div>
                        </div>

                        {/* Toolbar */}
                        <div className="px-8 py-3 border-t border-slate-100 bg-slate-50/50 flex flex-wrap gap-6 items-center justify-between">
                            
                            <div className="flex bg-slate-100/80 rounded-lg p-1 border border-slate-200/60 shadow-sm">
                                <button onClick={() => setView('graph')} className={`flex items-center gap-2 px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${view === 'graph' ? 'bg-white text-indigo-600 shadow-sm border border-slate-200/50' : 'text-slate-500 hover:text-slate-700'}`}>
                                    <Icons.Network /> Network Graph
                                </button>
                                <button onClick={() => setView('kanban')} className={`flex items-center gap-2 px-4 py-1.5 rounded-md text-sm font-medium transition-colors ${view === 'kanban' ? 'bg-white text-indigo-600 shadow-sm border border-slate-200/50' : 'text-slate-500 hover:text-slate-700'}`}>
                                    <Icons.Kanban /> Wave Swimlane
                                </button>
                            </div>

                            <div className="flex items-center gap-4 flex-1 justify-end">
                                <div className="flex bg-slate-100/80 rounded-lg p-1 border border-slate-200/60 shadow-sm">
                                    {['All', '0', '1', '2', '3', '4'].map(w => (
                                        <button 
                                            key={w} 
                                            onClick={() => { setWaveFilter(w); setSelectedNodeId(null); }}
                                            className={`px-3 py-1.5 rounded-md text-xs font-medium transition-colors ${waveFilter === w ? 'bg-white text-indigo-600 shadow-sm border border-slate-200/50' : 'text-slate-500 hover:text-slate-700'}`}
                                        >
                                            {w === 'All' ? 'All Waves' : `W${w}`}
                                        </button>
                                    ))}
                                </div>

                                <div className="relative flex items-center bg-slate-100 rounded-lg px-3 py-1.5 border border-slate-200 shadow-sm">
                                    <div className="text-slate-400">
                                        <Icons.Search />
                                    </div>
                                    <input 
                                        type="text" 
                                        placeholder="Search nodes..." 
                                        value={searchQuery}
                                        onChange={e => setSearchQuery(e.target.value)}
                                        className="bg-transparent border-none text-slate-800 text-sm ml-2 focus:ring-0 outline-none w-64 placeholder-slate-400" 
                                    />
                                    {searchQuery && (
                                        <button onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                                            <Icons.X />
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 flex overflow-hidden relative">
                        {/* Dynamic Container for Graph/Kanban (70% width if drawer is open) */}
                        <div className={`flex-1 transition-all duration-300 ease-in-out relative ${selectedItem ? 'mr-96' : ''}`}>
                            
                            {/* Active Filters / Selection Banner */}
                            {(selectedNodeId || waveFilter !== 'All' || searchQuery) && (
                                <div className="absolute top-4 left-1/2 transform -translate-x-1/2 z-10 flex gap-2">
                                    {selectedNodeId && (
                                        <div className="bg-white text-slate-800 px-4 py-2 rounded-full text-sm font-medium shadow-md flex items-center gap-2 border border-slate-200">
                                            <span className="text-slate-500">Selected:</span> <span className="font-bold text-indigo-600">{selectedNodeId}</span>
                                            <button onClick={() => setSelectedNodeId(null)} className="ml-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full p-1 transition-colors"><Icons.X /></button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {view === 'graph' ? (
                                <NetworkGraph 
                                    items={items} 
                                    selectedId={selectedNodeId} 
                                    onSelect={setSelectedNodeId}
                                    waveFilter={waveFilter}
                                    searchQuery={searchQuery}
                                />
                            ) : (
                                <SwimlaneView 
                                    items={items} 
                                    selectedId={selectedNodeId} 
                                    onSelect={setSelectedNodeId}
                                    waveFilter={waveFilter}
                                    searchQuery={searchQuery}
                                />
                            )}
                        </div>

                        {/* Inspector Drawer (30% width overlay) */}
                        <DetailDrawer 
                            item={selectedItem} 
                            onClose={() => setSelectedNodeId(null)}
                            onSelect={setSelectedNodeId}
                            allItems={items}
                        />
                    </main>

                    {/* Modal */}
                    <AddItemModal 
                        isOpen={isModalOpen}
                        onClose={() => setIsModalOpen(false)}
                        onSave={handleAddItem}
                        allItems={items}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
